# SPDX-License-Identifier: GPL-3.0-or-later
name: build

# This validates the local-only bundle but deliberately does not publish it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    # The main-branch ruleset requires this exact check name.
    name: build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libffi-dev libportaudio2 libwayland-dev pkg-config
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[build]"
      - name: Build standalone bundle
        run: scripts/build.sh --verbose

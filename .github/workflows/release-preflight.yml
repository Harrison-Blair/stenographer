# SPDX-License-Identifier: GPL-3.0-or-later
name: release preflight

# Read-only rehearsal of the draft-release workflow for PRs into main: the
# version/tag guard and wheel/sdist verification run here so unsafe release
# state is caught before merge. A PR run only exercises packaging, so it plans
# a patch version from tags and ignores drafts. A manual rehearsal checks draft
# state and its selected bump's authored notes; only a rehearsal on main also
# checks a matching draft's target commit.
# Lint, unit tests, and the standalone bundles are deliberately not repeated
# — lint.yml, test.yml, and build.yml already run them on every PR. Nothing
# here writes to releases or tags.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version component to rehearse
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Query every GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/releases.json"
      - name: Check release versions
        id: guard
        run: |
          python -m venv .venv
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            draft_args=(--skip-draft-checks)
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            draft_args=(--target-commit "${GITHUB_SHA}")
          else
            draft_args=(--skip-target-check)
          fi
          .venv/bin/python scripts/release_guard.py \
            "${RUNNER_TEMP}/releases.json" "${{ inputs.bump || 'patch' }}" \
            "${draft_args[@]}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Check authored release notes
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: .venv/bin/python scripts/release_notes.py check "${VERSION}" CHANGELOG.md
      - name: Reject a conflicting Git tag
        env:
          TAG: ${{ steps.guard.outputs.tag }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/${TAG}" || \
             git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "error: a Git tag already exists for ${TAG}" >&2
            exit 1
          fi

  python-distributions:
    name: release distribution check
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m venv .venv
          .venv/bin/pip install "build>=1.2"
          .venv/bin/python scripts/build_version.py \
            "${{ needs.preflight.outputs.version }}" src/stenographer/_version.py
          .venv/bin/python -m build
      - name: Verify distribution names and wheel contents
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          .venv/bin/python scripts/verify_distributions.py dist "$VERSION"

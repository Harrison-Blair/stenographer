# SPDX-License-Identifier: GPL-3.0-or-later
name: release preflight

# Read-only rehearsal of the draft-release workflow for PRs into main: the
# version/tag guard and the wheel/sdist verification run here so a release
# that would fail is caught before merge. Lint, unit tests, and the standalone
# bundles are deliberately not repeated — lint.yml, test.yml, and build.yml
# already run them on every PR. Nothing here writes to releases or tags.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Query every GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/releases.json"
      - name: Check release versions
        id: guard
        run: |
          python -m venv .venv
          .venv/bin/python scripts/release_guard.py \
            "${RUNNER_TEMP}/releases.json" src/stenographer/_version.py \
            --github-output "${GITHUB_OUTPUT}"
      - name: Reject a conflicting Git tag
        env:
          TAG: ${{ steps.guard.outputs.tag }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${TAG}" || \
             git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "error: a Git tag already exists for ${TAG}" >&2
            exit 1
          fi

  python-distributions:
    name: release distribution check
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m venv .venv
          .venv/bin/pip install "build>=1.2"
          .venv/bin/python -m build
      - name: Verify distribution names and wheel contents
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test -f "dist/stenographer-${VERSION}-py3-none-any.whl"
          test -f "dist/stenographer-${VERSION}.tar.gz"
          .venv/bin/python -m zipfile --list \
            "dist/stenographer-${VERSION}-py3-none-any.whl" \
            > "${RUNNER_TEMP}/wheel-files.txt"
          for completion in stenographer.bash _stenographer stenographer.fish; do
            grep -F "stenographer/assets/completions/${completion}" \
              "${RUNNER_TEMP}/wheel-files.txt"
          done
          .venv/bin/python scripts/sound_asset_guard.py \
            "dist/stenographer-${VERSION}-py3-none-any.whl" \
            --prefix stenographer/assets/sounds
          tar -tzf "dist/stenographer-${VERSION}.tar.gz" \
            > "${RUNNER_TEMP}/sdist-files.txt"
          grep -Fx "stenographer-${VERSION}/LICENSE" "${RUNNER_TEMP}/sdist-files.txt"
          for completion in stenographer.bash _stenographer stenographer.fish; do
            grep -Fx \
              "stenographer-${VERSION}/src/stenographer/assets/completions/${completion}" \
              "${RUNNER_TEMP}/sdist-files.txt"
          done
          .venv/bin/python scripts/sound_asset_guard.py \
            "dist/stenographer-${VERSION}.tar.gz" \
            --prefix "stenographer-${VERSION}/src/stenographer/assets/sounds"

# SPDX-License-Identifier: GPL-3.0-or-later
name: test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libffi-dev libportaudio2 libwayland-dev pkg-config
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Run unit tests
        run: .venv/bin/pytest -m "not integration"
      - name: Check CLI help
        run: .venv/bin/stenographer --help

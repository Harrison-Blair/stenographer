# SPDX-License-Identifier: GPL-3.0-or-later
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
      previous_tag: ${{ steps.guard.outputs.previous_tag }}
      previous_commit: ${{ steps.guard.outputs.previous_commit }}
    steps:
      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "error: releases must target main, not ${GITHUB_REF}" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Query every GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/releases.json"
      - name: Check release versions
        id: guard
        run: |
          python -m venv .venv
          .venv/bin/python scripts/release_guard.py \
            "${RUNNER_TEMP}/releases.json" "${{ inputs.bump }}" \
            --target-commit "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  lint:
    name: release lint
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: |
          python -m venv .venv
          .venv/bin/pip install ruff
      - name: Check source
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

  test:
    name: release unit tests
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libffi-dev libwayland-dev pkg-config
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python scripts/build_version.py \
            "${{ needs.preflight.outputs.version }}" src/stenographer/_version.py
          .venv/bin/pip install -e ".[dev]"
      - name: Run unit tests and CLI check
        run: |
          .venv/bin/pytest -m "not integration"
          .venv/bin/stenographer --help

  python-distributions:
    name: build wheel and source distribution
    needs: [preflight, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m venv .venv
          .venv/bin/pip install "build>=1.2"
          .venv/bin/python scripts/build_version.py \
            "${{ needs.preflight.outputs.version }}" src/stenographer/_version.py
          .venv/bin/python -m build
      - name: Verify distribution names and wheel contents
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          .venv/bin/python scripts/verify_distributions.py dist "$VERSION"
          cd dist
          sha256sum \
            "stenographer-${VERSION}-py3-none-any.whl" \
            "stenographer-${VERSION}.tar.gz" \
            > release-python.SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-python-distributions
          path: |
            dist/stenographer-${{ needs.preflight.outputs.version }}-py3-none-any.whl
            dist/stenographer-${{ needs.preflight.outputs.version }}.tar.gz
            dist/release-python.SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  standalone:
    name: build standalone (${{ matrix.archive_arch }})
    needs: [preflight, lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            machine: x86_64
            file_pattern: x86-64|x86_64
            archive_arch: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
            file_pattern: ARM aarch64|aarch64
            archive_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify native architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"
      - name: Install system and PyWayland source-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file libffi-dev libwayland-dev \
            pkg-config python3-dev
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python scripts/build_version.py \
            "${{ needs.preflight.outputs.version }}" src/stenographer/_version.py
          .venv/bin/pip install -e ".[build]"
      - name: Build and inspect native standalone bundle
        env:
          FILE_PATTERN: ${{ matrix.file_pattern }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          scripts/build.sh --verbose
          file dist/stenographer/stenographer | tee "${RUNNER_TEMP}/stenographer-file.txt"
          grep -Eq "${FILE_PATTERN}" "${RUNNER_TEMP}/stenographer-file.txt"
          test "$(dist/stenographer/stenographer --version)" = "${VERSION}"
          dist/stenographer/stenographer --help
      - name: Package standalone directory
        env:
          ARCHIVE_ARCH: ${{ matrix.archive_arch }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cp LICENSE dist/stenographer/LICENSE
          mkdir -p release
          tar -czf "release/stenographer-${VERSION}-linux-${ARCHIVE_ARCH}.tar.gz" \
            -C dist stenographer
          tar -tzf "release/stenographer-${VERSION}-linux-${ARCHIVE_ARCH}.tar.gz" \
            > "${RUNNER_TEMP}/standalone-files.txt"
          grep -Fx 'stenographer/LICENSE' "${RUNNER_TEMP}/standalone-files.txt"
          .venv/bin/python scripts/sound_asset_guard.py \
            "release/stenographer-${VERSION}-linux-${ARCHIVE_ARCH}.tar.gz" \
            --prefix stenographer/_internal/stenographer/assets/sounds
          cd release
          sha256sum "stenographer-${VERSION}-linux-${ARCHIVE_ARCH}.tar.gz" \
            > "release-${ARCHIVE_ARCH}.SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: release-standalone-${{ matrix.archive_arch }}
          path: |
            release/stenographer-${{ needs.preflight.outputs.version }}-linux-${{ matrix.archive_arch }}.tar.gz
            release/release-${{ matrix.archive_arch }}.SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    name: create or refresh draft release
    needs: [preflight, lint, test, python-distributions, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare release helper environment
        run: python -m venv .venv
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify transferred artifacts and checksums
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd release
          artifacts=(
            "stenographer-${VERSION}-linux-x86_64.tar.gz"
            "stenographer-${VERSION}-linux-aarch64.tar.gz"
            "stenographer-${VERSION}-py3-none-any.whl"
            "stenographer-${VERSION}.tar.gz"
          )
          for artifact in "${artifacts[@]}"; do
            test -s "${artifact}"
          done
          sha256sum --check release-python.SHA256SUMS
          sha256sum --check release-x86_64.SHA256SUMS
          sha256sum --check release-aarch64.SHA256SUMS
          rm release-python.SHA256SUMS \
            release-x86_64.SHA256SUMS release-aarch64.SHA256SUMS
          sha256sum "${artifacts[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Add the install script
        run: cp scripts/quick-install.sh release/quick-install.sh
      - name: Recheck release guard before attesting
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          EXPECTED_PREVIOUS_COMMIT: ${{ needs.preflight.outputs.previous_commit }}
        run: |
          git fetch --tags origin
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/releases-recheck.json"
          python -m venv .venv
          .venv/bin/python scripts/release_guard.py \
            "${RUNNER_TEMP}/releases-recheck.json" "${{ inputs.bump }}" \
            --target-commit "${GITHUB_SHA}" \
            --github-output "${RUNNER_TEMP}/guard-recheck.env"
          source "${RUNNER_TEMP}/guard-recheck.env"
          if [[ "${tag}" != "${TAG}" || "${version}" != "${VERSION}" || \
                "${previous_tag}" != "${EXPECTED_PREVIOUS_TAG}" || \
                "${previous_commit}" != "${EXPECTED_PREVIOUS_COMMIT}" ]]; then
            echo "error: stable tag history or release plan changed during the run" >&2
            exit 1
          fi
      - name: Attest all release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Final guard, create or refresh draft, upload assets, and publish
        env:
          EXPECTED_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          EXPECTED_PREVIOUS_COMMIT: ${{ needs.preflight.outputs.previous_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${RUNNER_TEMP}/releases-final.json"
          .venv/bin/python scripts/release_guard.py \
            "${RUNNER_TEMP}/releases-final.json" "${{ inputs.bump }}" \
            --target-commit "${GITHUB_SHA}" \
            --github-output "${RUNNER_TEMP}/guard.env"
          source "${RUNNER_TEMP}/guard.env"
          if [[ "${tag}" != "${EXPECTED_TAG}" || "${version}" != "${EXPECTED_VERSION}" || \
                "${previous_tag}" != "${EXPECTED_PREVIOUS_TAG}" || \
                "${previous_commit}" != "${EXPECTED_PREVIOUS_COMMIT}" ]]; then
            echo "error: stable tag history or release plan changed during the run" >&2
            exit 1
          fi
          TAG="${tag}"
          VERSION="${version}"
          DRAFT_ID="${draft_id}"
          printf 'v%s' "${VERSION}" > "${RUNNER_TEMP}/release-name.txt"

          request=(
            -f "tag_name=${TAG}"
            -F "name=@${RUNNER_TEMP}/release-name.txt"
            -F draft=true
            -F prerelease=false
          )
          if [[ -n "${DRAFT_ID}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" \
              > "${RUNNER_TEMP}/draft-before-refresh.json"
            jq -e --arg tag "${TAG}" --arg target "${GITHUB_SHA}" \
              '.draft == true and .tag_name == $tag and .target_commitish == $target' \
              "${RUNNER_TEMP}/draft-before-refresh.json" > /dev/null
            release_id=$(gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}" \
              "${request[@]}" --jq .id)
          else
            release_id=$(gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              -f "target_commitish=${GITHUB_SHA}" \
              -F generate_release_notes=true \
              "${request[@]}" --jq .id)
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > "${RUNNER_TEMP}/draft-after-write.json"
          jq -e --arg tag "${TAG}" --arg target "${GITHUB_SHA}" \
            '.draft == true and .tag_name == $tag and .target_commitish == $target' \
            "${RUNNER_TEMP}/draft-after-write.json" > /dev/null

          assets=(
            "stenographer-${VERSION}-linux-x86_64.tar.gz"
            "stenographer-${VERSION}-linux-aarch64.tar.gz"
            "stenographer-${VERSION}-py3-none-any.whl"
            "stenographer-${VERSION}.tar.gz"
            SHA256SUMS
            quick-install.sh
          )
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > "${RUNNER_TEMP}/release-assets.json"
          for asset in "${assets[@]}"; do
            jq -r --arg name "${asset}" \
              '.[][] | select(.name == $name) | .id' \
              "${RUNNER_TEMP}/release-assets.json" \
              | while IFS= read -r asset_id; do
                  gh api -X DELETE \
                    "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                done
          done
          asset_paths=()
          for asset in "${assets[@]}"; do
            asset_paths+=("release/${asset}")
          done
          gh release upload "${TAG}" "${asset_paths[@]}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > "${RUNNER_TEMP}/draft-uploaded.json"
          jq -e --arg tag "${TAG}" \
            '.draft == true and .tag_name == $tag
              and ([.assets[].name] | sort) == ($ARGS.positional | sort)' \
            "${RUNNER_TEMP}/draft-uploaded.json" --args "${assets[@]}" > /dev/null

          # Nothing but the deploy follows publication: a published release must
          # not be rerun, because a new run would publish the next version.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f "tag_name=${TAG}" -F draft=false \
            > "${RUNNER_TEMP}/release-published.json"
          jq -e --arg tag "${TAG}" '.draft == false and .tag_name == $tag' \
            "${RUNNER_TEMP}/release-published.json" > /dev/null
      # A release published with the workflow token does not trigger other workflows.
      - name: Start the site deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh workflow run pages.yml --ref main -f ref="${TAG}"

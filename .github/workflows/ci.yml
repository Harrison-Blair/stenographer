# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

# Lint and unit-test checks for pull requests targeting main. Tests run on
# Python 3.12 to enforce the package floor (requires-python = ">=3.12"),
# regardless of the newer interpreter developers use locally.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libportaudio2
      - name: Install dev extras
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: pytest (unit)
        run: .venv/bin/pytest -m "not integration"

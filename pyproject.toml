[project]
name = "stenographer"
dynamic = ["version"]
description = "Local, offline, Wayland push-to-talk dictation."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [{ name = "stenographer contributors" }]

dependencies = [
    "sounddevice>=0.4.7",
    "numpy>=2.0",
    "faster-whisper>=1.0.0",
    "evdev>=1.4",
    "soundfile>=0.12",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]

[project.scripts]
stenographer = "stenographer.cli:main"

[project.urls]
Homepage = "https://github.com/Harrison-Blair/stenographer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/stenographer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stenographer"]
include = [
    "src/stenographer/assets/sounds/*.wav",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that touch the user's environment (clipboard, real audio). Set STENOGRAPHER_INTEGRATION=1 to run.",
]

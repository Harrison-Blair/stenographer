[project]
name = "stenographer"
dynamic = ["version"]
description = "Local, offline push-to-talk dictation."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [{ name = "stenographer contributors" }]

dependencies = [
    "sounddevice>=0.4.7",
    "numpy>=2.0",
    "faster-whisper>=1.0.0",
    "evdev>=1.4; sys_platform == 'linux'",
    "soundfile>=0.12",
    "huggingface_hub>=0.23",
    "pillow>=11.0",
    "pywayland==0.4.18; sys_platform == 'linux'",
    "python-xlib==0.33; sys_platform == 'linux'",
    "tomlkit>=0.13",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
stenographer = "stenographer.cli:main"

[project.urls]
Homepage = "https://github.com/Harrison-Blair/stenographer"
Documentation = "https://harrison-blair.github.io/stenographer/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/stenographer/_version.py"

[tool.hatch.build]
# Hatchling can discard VCS rules when a catch-all also matches the project root.
# Apply the .gitignore policy explicitly; keep both ordered rule lists synchronized.
ignore-vcs = true
exclude = [
    # Ignore everything unless an approved path below allows it.
    "*",
    # Root project metadata and shared guidance.
    "!/.gitignore",
    "!/.python-version",
    "!/pyproject.toml",
    "!/LICENSE",
    "!/README.md",
    "!/BUILD.md",
    "!/AGENTS.md",
    "!/CLAUDE.md",
    # Application code, including lib/ and generated platform bindings.
    "!/src/",
    "!/src/stenographer/",
    "!/src/stenographer/**/",
    "!/src/stenographer/**/*.py",
    # Bundled resources: additions require an explicit path.
    "!/src/stenographer/assets/completions/_stenographer",
    "!/src/stenographer/assets/completions/stenographer.bash",
    "!/src/stenographer/assets/completions/stenographer.fish",
    "!/src/stenographer/assets/default_config.toml.in",
    "!/src/stenographer/assets/fonts/Caveat-OFL.txt",
    "!/src/stenographer/assets/fonts/Caveat-wght.ttf",
    "!/src/stenographer/assets/icons/stenographer.png",
    "!/src/stenographer/assets/keycodes.toml",
    "!/src/stenographer/assets/sounds/legacy/delivered.wav",
    "!/src/stenographer/assets/sounds/legacy/error.wav",
    "!/src/stenographer/assets/sounds/legacy/record_start.wav",
    "!/src/stenographer/assets/sounds/legacy/record_stop.wav",
    "!/src/stenographer/assets/sounds/minimal-ui/delivered.wav",
    "!/src/stenographer/assets/sounds/minimal-ui/error.wav",
    "!/src/stenographer/assets/sounds/minimal-ui/record_start.wav",
    "!/src/stenographer/assets/sounds/minimal-ui/record_stop.wav",
    "!/src/stenographer/assets/sounds/soft-electronic/delivered.wav",
    "!/src/stenographer/assets/sounds/soft-electronic/error.wav",
    "!/src/stenographer/assets/sounds/soft-electronic/record_start.wav",
    "!/src/stenographer/assets/sounds/soft-electronic/record_stop.wav",
    "!/src/stenographer/assets/sounds/warm-desk/delivered.wav",
    "!/src/stenographer/assets/sounds/warm-desk/error.wav",
    "!/src/stenographer/assets/sounds/warm-desk/record_start.wav",
    "!/src/stenographer/assets/sounds/warm-desk/record_stop.wav",
    # Tests and fixture instructions; speech recordings stay local.
    "!/tests/",
    "!/tests/**/",
    "!/tests/**/*.py",
    "!/tests/fixtures/README.md",
    # Development and installation scripts.
    "!/scripts/",
    "!/scripts/**/",
    "!/scripts/**/*.py",
    "!/scripts/**/*.sh",
    # Packaging code, build spec, service, and acceptance instructions.
    "!/packaging/",
    "!/packaging/**/",
    "!/packaging/**/*.py",
    "!/packaging/stenographer.spec",
    "!/packaging/stenographer.service",
    "!/packaging/NATIVE-ACCEPTANCE.md",
    # GitHub workflows.
    "!/.github/",
    "!/.github/workflows/",
    "!/.github/workflows/*.yml",
    "!/.github/workflows/*.yaml",
    # Maintained documentation and curated Refactoring.Guru references.
    "!/docs/",
    "!/docs/architecture.md",
    "!/docs/cue-audition.md",
    "!/docs/reference/",
    "!/docs/reference/guru/",
    "!/docs/reference/guru/code-smells.md",
    "!/docs/reference/guru/refactoring-techniques.md",
    # GitHub Pages site; the icon and font are copied from src/ at deploy time.
    "!/site/",
    "!/site/index.html",
    "!/site/site.css",
    "!/site/pill.js",
    "!/site/favicon.png",
    # Local and generated directories remain excluded inside approved trees.
    "__pycache__/",
    ".venv/",
    "venv/",
    "env/",
    "ENV/",
    ".cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".mypy_cache/",
    ".hypothesis/",
    ".tox/",
    ".nox/",
    "*.egg-info/",
    "build/",
    "dist/",
    "htmlcov/",
    ".agents/",
    ".claude/",
    ".codex/",
    ".fledge/",
    ".vscode/",
    ".idea/",
    # Exclude their contents explicitly too: package builders can traverse ignored parents.
    "**/__pycache__/**",
    "**/.venv/**",
    "**/venv/**",
    "**/env/**",
    "**/ENV/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
    "**/.ruff_cache/**",
    "**/.mypy_cache/**",
    "**/.hypothesis/**",
    "**/.tox/**",
    "**/.nox/**",
    "**/*.egg-info/**",
    "**/build/**",
    "**/dist/**",
    "**/htmlcov/**",
    "**/.agents/**",
    "**/.claude/**",
    "**/.codex/**",
    "**/.fledge/**",
    "**/.vscode/**",
    "**/.idea/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stenographer"]
include = [
    "src/stenographer/assets/fonts/*.ttf",
    "src/stenographer/assets/fonts/*.txt",
    "src/stenographer/assets/icons/*.png",
    "src/stenographer/assets/sounds/**/*.wav",
    "src/stenographer/assets/completions/*",
    "src/stenographer/assets/keycodes.toml",
    "src/stenographer/assets/default_config.toml.in",
    "src/stenographer/overlay/platform/linux/backends/protocols/**/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that touch the user's environment (clipboard, real audio). Set STENOGRAPHER_INTEGRATION=1 to run.",
]
